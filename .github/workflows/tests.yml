name: Router offline tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Run simple router offline tests
        run: python -m unittest -v test_simple_router.py
      - name: CLI smoke checks without real API keys
        run: |
          python model_router.py --list
          python model_router.py --reset-health
          python model_router.py --help
      - name: Syntax check
        run: python -m py_compile model_router.py answer_validation.py router_errors.py router_health.py router_policy.py verify_free_apis_v2.py simple_router.py test_simple_router.py
